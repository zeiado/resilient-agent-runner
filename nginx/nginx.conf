events {}

http {
    # Docker's DNS. With "resolve", a replica that comes back with a new IP is picked up
    # without restarting Nginx.
    resolver 127.0.0.11 valid=5s;

    upstream api {
        zone api 64k;
        server api1:8000 resolve max_fails=2 fail_timeout=10s;
        server api2:8000 resolve max_fails=2 fail_timeout=10s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 2s;
            proxy_read_timeout 30s;
            # a request that hits a dead replica is retried on the other one
            proxy_next_upstream error timeout http_502 http_503;
            add_header X-Upstream $upstream_addr always;
        }
    }
}
